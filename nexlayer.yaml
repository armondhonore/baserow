application:
  name: baserow
  pods:
  - name: app
    image: mirror.gcr.io/baserow/baserow:latest
    path: /
    servicePorts:
    - 80
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    vars:
      BASEROW_PUBLIC_URL: "https://relaxed-weasel-baserow.cloud.nexlayer.ai"
      DISABLE_VOLUME_CHECK: "yes"
      DATABASE_HOST: postgres.pod
      DATABASE_NAME: baserow
      DATABASE_USER: baserow
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_HOST: redis.pod
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "6379"
      REDIS_PROTOCOL: "redis"
  - name: postgres
    image: mirror.gcr.io/library/postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: baserow
      POSTGRES_USER: baserow
      POSTGRES_PASSWORD: baserow
    volumes:
    - name: baserow-db
      mountPath: /var/lib/postgresql/data
      size: 10Gi
  - name: redis
    image: mirror.gcr.io/library/redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    servicePorts:
    - 6379
